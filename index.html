<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>諮詢師預約數字分析面板</title>
    <!-- 引入 Excel 解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #F8F4F4;
            --primary-morandi: #A86D6D;
            --secondary-morandi: #D4A5A5;
            --light-pink: #F3E4E4;
            --accent-dark: #6E4A4A;
            --cancel-color: #9E7D7D;
            --cancel-bg: #EFE6E6;
            --text-main: #4A3E3E;
            --card-bg: #FFFFFF;
            --shadow: 0 4px 16px rgba(110, 74, 74, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 960px;
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--secondary-morandi);
        }

        h1 {
            color: var(--accent-dark);
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .header-desc {
            color: var(--cancel-color);
            font-size: 0.95rem;
            margin: 0 0 15px 0;
        }

        /* 檔案上傳與總計列 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: white;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            width: 100%;
            max-width: 960px;
        }

        .upload-btn {
            background-color: var(--secondary-morandi);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .upload-btn:hover {
            background-color: var(--primary-morandi);
        }

        #fileInput { display: none; }

        .month-summary {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-dark);
        }

        .month-summary .cancel-tag {
            color: var(--cancel-color);
            font-weight: normal;
            font-size: 0.9rem;
            margin-left: 6px;
        }

        /* 主要日曆列表容器 */
        .container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 每日區塊 */
        .date-block {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 22px;
            box-shadow: var(--shadow);
            border-left: 6px solid var(--primary-morandi);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .date-block:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(110, 74, 74, 0.12);
        }

        /* 當天高亮標記 */
        .today-card {
            border: 2px solid var(--primary-morandi);
            border-left: 8px solid var(--accent-dark);
            background: #FFFDFD;
        }

        .today-badge {
            background: var(--accent-dark);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .date-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--secondary-morandi);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .date-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent-dark);
            display: flex;
            align-items: center;
        }

        .total-badge {
            background: var(--light-pink);
            color: var(--accent-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .total-badge .cancel-num {
            color: var(--cancel-color);
            font-size: 0.85rem;
            font-weight: normal;
            margin-left: 5px;
        }

        /* 諮詢師區塊 */
        .consultant-row {
            margin-bottom: 16px;
            background: #FAFAFA;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #F0E8E8;
        }

        .consultant-row:last-child {
            margin-bottom: 0;
        }

        .consultant-name-bar {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .consultant-name-bar::before {
            content: "✦";
            color: var(--primary-morandi);
            margin-right: 8px;
            font-size: 0.9rem;
        }

        .consultant-cancel-tag {
            color: var(--cancel-color);
            font-size: 0.85rem;
            font-weight: normal;
            margin-left: 6px;
            background: var(--cancel-bg);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .customer-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .customer-btn {
            background: white;
            border: 1px solid var(--secondary-morandi);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .customer-btn:hover {
            background: var(--primary-morandi);
            color: white;
            border-color: var(--primary-morandi);
            transform: translateY(-1px);
        }

        /* Modal 彈窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(40, 25, 25, 0.45);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 520px;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.15);
            overflow: hidden;
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes modalFadeIn {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background: var(--primary-morandi);
            color: white;
            padding: 16px 22px;
            font-size: 1.15rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            cursor: pointer;
            font-size: 1.6rem;
            line-height: 1;
            transition: transform 0.2s;
        }

        .close-btn:hover { transform: scale(1.15); }

        .modal-body {
            padding: 20px 24px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .detail-item {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #F5ECEC;
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .detail-item:last-child { border-bottom: none; }

        .detail-label {
            width: 100px;
            flex-shrink: 0;
            color: var(--accent-dark);
            font-weight: 600;
        }

        .detail-value {
            flex: 1;
            color: var(--text-main);
            word-break: break-all;
        }
    </style>
</head>
<body>

<header>
    <h1>諮詢師預約營運分析面板</h1>
    <p class="header-desc">莫蘭迪粉紅風格 ｜ 每日諮詢預約量與取消數監控</p>
</header>

<div class="toolbar">
    <label class="upload-btn">
        📁 匯入 / 切換 Excel 報表
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
    </label>
    <div class="month-summary" id="overallSummary">
        總預約：計算中...
    </div>
</div>

<div class="container" id="dataContainer">
    <!-- 日期區塊由 JavaScript 動態生成 -->
</div>

<!-- 詳細資料彈跳視窗 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modalTitle">客戶預約詳細資訊</span>
            <span class="close-btn" onclick="closeModal()">×</span>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- 欄位 A, B, C, G, J, M, N, O, P -->
        </div>
    </div>
</div>

<script>
    // 預設資料存放處（支援動態匯入與初始載入）
    let currentData = [];

    // 格式化今日日期字串 (YYYY-MM-DD)
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

    // 渲染面板主邏輯
    function renderDashboard(dataList) {
        const container = document.getElementById('dataContainer');
        container.innerHTML = '';

        let allValid = 0;
        let allCancel = 0;

        if (!dataList || dataList.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">暫無預約資料</div>';
            document.getElementById('overallSummary').innerHTML = '總預約：0 <span class="cancel-tag">(取消 0)</span>';
            return;
        }

        dataList.forEach(day => {
            allValid += day.validCount;
            allCancel += day.cancelCount;

            const isToday = (day.date === todayStr);
            const block = document.createElement('div');
            block.className = `date-block ${isToday ? 'today-card' : ''}`;
            block.id = 'date-' + day.date;

            let consultantsHtml = '';
            day.consultants.forEach(con => {
                let customersHtml = '';
                con.customers.forEach(cust => {
                    const custJson = JSON.stringify(cust).replace(/"/g, '&quot;');
                    customersHtml += `<button class="customer-btn" onclick="showDetails(${custJson})">${cust.C || '顧客'}</button>`;
                });

                if (con.customers.length === 0) {
                    customersHtml = '<span style="font-size:0.85rem; color:#A09090;">（該日均已取消）</span>';
                }

                consultantsHtml += `
                    <div class="consultant-row">
                        <div class="consultant-name-bar">
                            ${con.name}：${con.validCount} 位
                            <span class="consultant-cancel-tag">(取消 ${con.cancelCount})</span>
                        </div>
                        <div class="customer-tags">${customersHtml}</div>
                    </div>
                `;
            });

            block.innerHTML = `
                <div class="date-header">
                    <div class="date-title">
                        ${day.date}
                        ${isToday ? '<span class="today-badge">今日</span>' : ''}
                    </div>
                    <div class="total-badge">
                        總預約：${day.validCount}
                        <span class="cancel-num">(取消 ${day.cancelCount})</span>
                    </div>
                </div>
                ${consultantsHtml}
            `;
            container.appendChild(block);
        });

        // 更新頂部總計
        document.getElementById('overallSummary').innerHTML = `
            全期預約總計：${allValid} 位 
            <span class="cancel-tag">(取消 ${allCancel})</span>
        `;

        // 自動平滑捲動到當天 (若當天無排程，則捲動到最近的日期)
        setTimeout(() => {
            const todayElem = document.getElementById('date-' + todayStr);
            if (todayElem) {
                todayElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (dataList.length > 0) {
                // 若當天不在範圍內，找到第一個大於等於當天的日期
                const nextDay = dataList.find(d => d.date >= todayStr);
                const targetId = nextDay ? 'date-' + nextDay.date : 'date-' + dataList[0].date;
                const targetElem = document.getElementById(targetId);
                if (targetElem) {
                    targetElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }, 300);
    }

    // 顯示詳細資料彈窗 (呈現 A, B, C, G, J, M, N, O, P)
    function showDetails(cust) {
        document.getElementById('modalTitle').innerText = `${cust.C || '顧客'} - 預約詳情`;
        const modalBody = document.getElementById('modalBody');
        
        modalBody.innerHTML = `
            <div class="detail-item"><div class="detail-label">客戶姓名 (C)</div><div class="detail-value">${cust.C || '-'}</div></div>
            <div class="detail-item"><div class="detail-label">客戶編號 (A)</div><div class="detail-value">${cust.A || '-'}</div></div>
            <div class="detail-item"><div class="detail-label">客戶電話 (B)</div><div class="detail-value">${cust.B || '-'}</div></div>
            <div class="detail-item"><div class="detail-label">預約狀況 (G)</div><div class="detail-value"><span style="color:#B85050; font-weight:600;">${cust.G || '-'}</span></div></div>
            <div class="detail-item"><div class="detail-label">預約時間 (J)</div><div class="detail-value">${cust.J || '-'}</div></div>
            <div class="detail-item"><div class="detail-label">協助人員 (M)</div><div class="detail-value">${cust.M || '無'}</div></div>
            <div class="detail-item"><div class="detail-label">預約醫師 (N)</div><div class="detail-value">${cust.N || '無'}</div></div>
            <div class="detail-item"><div class="detail-label">預約療程 (O)</div><div class="detail-value">${cust.O || '無'}</div></div>
            <div class="detail-item"><div class="detail-label">備  註 (P)</div><div class="detail-value">${cust.P || '無'}</div></div>
        `;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target === document.getElementById('modalOverlay')) {
            closeModal();
        }
    };

    // 解析 Excel/CSV 檔案並依規則計算
    function processExcelData(rawRows) {
        const dateMap = {};

        rawRows.forEach(row => {
            // 對應欄位 (依原表順序)
            // A:客戶編號, B:客戶電話, C:客戶姓名, G:預約狀況, I:預約日期, J:預約時間, L:預約諮詢師, M:協助人員, N:預約醫師, O:預約療程, P:備註
            const date = (row['預約日期'] || row['I'] || '').toString().trim();
            const consultant = (row['預約諮詢師'] || row['L'] || '未指定諮詢師').toString().trim();
            const status = (row['預約狀況'] || row['G'] || '').toString().trim();

            if (!date || date === '預約日期') return; // 過濾表頭或空列

            const isCanceled = status.includes('取消');

            if (!dateMap[date]) {
                dateMap[date] = {
                    date: date,
                    validCount: 0,
                    cancelCount: 0,
                    consultants: {}
                };
            }

            if (isCanceled) {
                dateMap[date].cancelCount += 1;
            } else {
                dateMap[date].validCount += 1;
            }

            if (!dateMap[date].consultants[consultant]) {
                dateMap[date].consultants[consultant] = {
                    name: consultant,
                    validCount: 0,
                    cancelCount: 0,
                    customers: []
                };
            }

            if (isCanceled) {
                dateMap[date].consultants[consultant].cancelCount += 1;
            } else {
                dateMap[date].consultants[consultant].validCount += 1;
                dateMap[date].consultants[consultant].customers.push({
                    A: row['客戶編號'] || row['A'] || '',
                    B: row['客戶電話'] || row['B'] || '',
                    C: row['客戶姓名'] || row['C'] || '',
                    G: status,
                    J: row['預約時間'] || row['J'] || '',
                    M: row['協助人員'] || row['M'] || '',
                    N: row['預約醫師'] || row['N'] || '',
                    O: row['預約療程'] || row['O'] || '',
                    P: row['備註'] || row['P'] || ''
                });
            }
        });

        // 轉換為排序好的陣列
        const sortedDates = Object.keys(dateMap).sort();
        return sortedDates.map(d => {
            const dayObj = dateMap[d];
            const sortedConsultants = Object.values(dayObj.consultants).sort((a, b) => b.validCount - a.validCount);
            return {
                date: dayObj.date,
                validCount: dayObj.validCount,
                cancelCount: dayObj.cancelCount,
                consultants: sortedConsultants
            };
        });
    }

    // 檔案上傳事件監聽
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            currentData = processExcelData(jsonRows);
            renderDashboard(currentData);
        };
        reader.readAsArrayBuffer(file);
    });

    // 初始載入：提示使用者選取檔案
    window.addEventListener('DOMContentLoaded', () => {
        // 您亦可將預約明細 Excel 檔案直接由上方按鈕選取匯入
        document.getElementById('overallSummary').innerHTML = '請點選左側按鈕上傳或更換 Excel 報表';
    });
</script>
</body>
</html>
