<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>諮詢人員表現總覽與每日預約分析</title>
    <!-- SheetJS 用於解析 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #F8F3F3;
            --card-bg: #FFFFFF;
            --primary-morandi: #9D6B6B;
            --primary-morandi-light: #F4E8E8;
            --secondary-morandi: #C89F9F;
            --accent-dark: #634343;
            --text-dark: #4A3A3A;
            --text-muted: #8C7B7B;
            --border-color: #EADCDC;
            --cancel-color: #A37F7F;
            --cancel-bg: #F0ECEC;
            --badge-good: #DE5347;
            --badge-target: #3CA577;
            --badge-low: #E28834;
            --badge-champion: #D4A017;
            --actual-green: #1F7A3E;
            --arrived-blue: #186646;
            --shadow: 0 4px 12px rgba(99, 67, 67, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1280px;
        }

        /* 頂部操作列 */
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .upload-btn {
            background-color: var(--secondary-morandi);
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .upload-btn:hover { background-color: var(--primary-morandi); }
        #excelFileInput { display: none; }

        /* 表現總覽卡片外框 */
        .overview-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .overview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .overview-title-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .overview-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 區間總統計徽章 */
        .range-overall-badge {
            background: var(--primary-morandi-light);
            border: 1px solid var(--secondary-morandi);
            color: var(--accent-dark);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.94rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* 數字醒目標示：實際預約 & 實際到店 粗體放大 */
        .highlight-actual {
            color: var(--actual-green);
            font-size: 1.05em;
            font-weight: 700;
        }

        .highlight-arrived {
            color: var(--arrived-blue);
            font-size: 1.08em;
            font-weight: 800;
            background: rgba(43, 110, 72, 0.08);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .highlight-cancel {
            color: var(--cancel-color);
            font-size: 0.9em;
            font-weight: 400;
        }

        /* 日期區間過濾列 */
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .filter-group input[type="date"] {
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            color: var(--text-dark);
            background: #FAFAFA;
            outline: none;
        }

        .btn-filter {
            background-color: var(--primary-morandi);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: 0.2s;
        }

        .btn-filter:hover { background-color: var(--accent-dark); }

        .btn-clear {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: 0.2s;
        }

        .btn-clear:hover { background-color: #F0ECEC; }

        /* 人員總覽格狀卡片 */
        .consultant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
            gap: 16px;
        }

        .consultant-card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s ease;
        }

        .consultant-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(157, 107, 107, 0.15);
            border-color: var(--secondary-morandi);
        }

        .card-person-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-booking-badge {
            background-color: var(--primary-morandi);
            color: white;
            font-size: 0.84rem;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 14px;
            width: 100%;
            text-align: center;
            line-height: 1.45;
        }

        .card-booking-sub {
            display: block;
            font-size: 0.76rem;
            font-weight: 400;
            margin-top: 3px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            padding: 3px 4px;
        }

        .card-booking-sub .highlight-actual {
            color: #E8F5E9;
            font-weight: 700;
            font-size: 1.08em;
        }

        .card-booking-sub .highlight-arrived {
            color: #C8E6C9;
            font-weight: 800;
            font-size: 1.1em;
            background: transparent;
            padding: 0;
        }

        .card-booking-sub .highlight-cancel {
            color: #FFEBEE;
            opacity: 0.9;
        }

        .card-stats-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 7px;
            font-size: 0.83rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
        }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-dark);
        }

        .stat-val {
            font-weight: 600;
            color: var(--text-dark);
        }

        /* 下方每日明細區塊 */
        .daily-section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .daily-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .daily-card {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-morandi);
        }

        .daily-card.today-card {
            border-left: 6px solid var(--accent-dark);
            background: #FFFAF9;
            box-shadow: 0 4px 16px rgba(157, 107, 107, 0.12);
        }

        .daily-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: 12px;
        }

        .daily-date {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .today-pill {
            background: var(--accent-dark);
            color: white;
            font-size: 0.72rem;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 500;
        }

        .daily-total-badge {
            background: var(--primary-morandi-light);
            color: var(--accent-dark);
            padding: 5px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* 每日名單緊密排版 */
        .daily-consultants-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .daily-con-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #FDFBFB;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #F3EDED;
        }

        .con-name-badge {
            flex-shrink: 0;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            gap: 4px;
            padding-top: 3px;
            flex-wrap: wrap;
            max-width: 380px;
            line-height: 1.4;
        }

        .customer-tags-flow {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .all-canceled-note {
            font-size: 0.8rem;
            color: #A37F7F;
            background: #F7EFEF;
            padding: 2px 8px;
            border-radius: 6px;
            margin-right: 4px;
        }

        /* 正常顧客按鈕標籤 */
        .customer-btn {
            background: white;
            border: 1px solid var(--secondary-morandi);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .customer-btn:hover {
            background: var(--primary-morandi);
            color: white;
            border-color: var(--primary-morandi);
        }

        /* 已完成服務 (到店) 的打勾圖示 */
        .icon-completed {
            color: #2E7D32;
            font-weight: bold;
            font-size: 0.88rem;
        }

        .customer-btn:hover .icon-completed {
            color: #A5D6A7;
        }

        /* 取消顧客標籤 */
        .customer-btn.is-canceled {
            background: var(--cancel-bg);
            border: 1px dashed #D0BCBC;
            color: #8C7575;
            text-decoration: line-through;
            opacity: 0.85;
        }

        .customer-btn.is-canceled:hover {
            background: #E8DDDD;
            color: #634343;
            border-color: #B59C9C;
            text-decoration: line-through;
        }

        /* 浮動置頂按鈕 */
        .fab-scroll-top {
            position: fixed;
            right: 28px;
            bottom: 28px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--primary-morandi);
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: transform 0.2s, background-color 0.2s;
            z-index: 99;
        }

        .fab-scroll-top:hover {
            transform: scale(1.08);
            background-color: var(--accent-dark);
        }

        /* 彈出視窗 Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(35, 20, 20, 0.45);
            backdrop-filter: blur(3px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            animation: popUp 0.2s ease-out;
        }

        @keyframes popUp {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background: var(--primary-morandi);
            color: white;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
        }

        .modal-body {
            padding: 18px 22px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #F6EFEF;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-col-label {
            width: 105px;
            flex-shrink: 0;
            color: var(--accent-dark);
            font-weight: 600;
        }

        .detail-col-val {
            flex: 1;
            color: var(--text-dark);
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- 頂端操作資訊列 -->
    <div class="top-action-bar">
        <label class="upload-btn">
            📂 上傳 / 切換 Excel 檔案
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv">
        </label>
        <div id="fileStatusText" style="font-size:0.9rem; color:var(--text-muted);">
            正在讀取預約資料...
        </div>
    </div>

    <!-- 上方：所有諮詢人員表現總覽 -->
    <section class="overview-section">
        <div class="overview-header">
            <div class="overview-title-group">
                <div class="overview-title">
                    <span>🎗️</span> 所有諮詢人員表現總覽
                </div>
                <!-- 格式：總預約 XX (實際預約XX+取消預約X) 實際到店XX -->
                <div class="range-overall-badge" id="rangeSummaryBadge">
                    總預約 0 (實際預約 0 + 取消預約 0) 實際到店 0
                </div>
            </div>

            <div class="filter-group">
                <span>📅 日期區間：</span>
                <input type="date" id="filterStartDate">
                <span>至</span>
                <input type="date" id="filterEndDate">
                <button class="btn-filter" onclick="applyDateFilter()">套用</button>
                <button class="btn-clear" onclick="resetDateFilter()">清除</button>
            </div>
        </div>

        <div class="consultant-grid" id="consultantOverviewGrid">
            <!-- 動態生成諮詢師表現卡片 -->
        </div>
    </section>

    <!-- 下方：每日預約細項清單 -->
    <div class="daily-section-title">
        <span>📋</span> 每日預約名單與細項分析
    </div>

    <div class="daily-container" id="dailyListContainer">
        <!-- 動態生成每日列表區塊 -->
    </div>
</div>

<!-- 浮動置頂按鈕 -->
<button class="fab-scroll-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="回頂部">↑</button>

<!-- 顧客詳情彈跳視窗 (A, B, C, G, H, J, M, N, O, P) -->
<div class="modal-overlay" id="customerModal">
    <div class="modal-box">
        <div class="modal-header">
            <span id="modalCustomerName">顧客預約詳情</span>
            <span class="close-btn" onclick="closeModal()">×</span>
        </div>
        <div class="modal-body" id="modalCustomerDetails">
            <!-- 彈窗內容 -->
        </div>
    </div>
</div>

<script>
    let allAppointments = []; 
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

    function parseRows(rawRows) {
        const rows = [];
        rawRows.forEach(r => {
            const date = (r['預約日期'] || r['I'] || '').toString().trim();
            const consultant = (r['預約諮詢師'] || r['L'] || '未指定諮詢師').toString().trim();
            const statusG = (r['預約狀況'] || r['G'] || '').toString().trim();
            const statusH = (r['服務狀態'] || r['H'] || '').toString().trim();

            if (!date || date === '預約日期') return;

            const isCanceled = statusG.includes('取消') || statusH.includes('取消');
            const isCompleted = statusH.includes('已完成'); // 實際到店判定

            rows.push({
                date: date,
                consultant: consultant,
                statusG: statusG,
                statusH: statusH,
                isCanceled: isCanceled,
                isCompleted: isCompleted,
                A: r['客戶編號'] || r['A'] || '',
                B: r['客戶電話'] || r['B'] || '',
                C: r['客戶姓名'] || r['C'] || '',
                G: statusG,
                H: statusH,
                J: r['預約時間'] || r['J'] || '',
                M: r['協助人員'] || r['M'] || '',
                N: r['預約醫師'] || r['N'] || '',
                O: r['預約療程'] || r['O'] || '',
                P: r['備註'] || r['P'] || ''
            });
        });
        return rows;
    }

    function updateDashboard(startDate = null, endDate = null) {
        const filteredRows = allAppointments.filter(item => {
            if (startDate && item.date < startDate) return false;
            if (endDate && item.date > endDate) return false;
            return true;
        });

        let totalRangeValid = 0;
        let totalRangeCancel = 0;
        let totalRangeArrived = 0;

        // 1. 每日聚合
        const dailyMap = {};
        filteredRows.forEach(row => {
            if (!dailyMap[row.date]) {
                dailyMap[row.date] = {
                    date: row.date,
                    validCount: 0,
                    cancelCount: 0,
                    arrivedCount: 0,
                    consultants: {}
                };
            }

            if (row.isCanceled) {
                dailyMap[row.date].cancelCount++;
                totalRangeCancel++;
            } else {
                dailyMap[row.date].validCount++;
                totalRangeValid++;
                if (row.isCompleted) {
                    dailyMap[row.date].arrivedCount++;
                    totalRangeArrived++;
                }
            }

            if (!dailyMap[row.date].consultants[row.consultant]) {
                dailyMap[row.date].consultants[row.consultant] = {
                    name: row.consultant,
                    validCount: 0,
                    cancelCount: 0,
                    arrivedCount: 0,
                    validCustomers: [],
                    canceledCustomers: []
                };
            }

            const conObj = dailyMap[row.date].consultants[row.consultant];
            if (row.isCanceled) {
                conObj.cancelCount++;
                conObj.canceledCustomers.push(row);
            } else {
                conObj.validCount++;
                if (row.isCompleted) {
                    conObj.arrivedCount++;
                }
                conObj.validCustomers.push(row);
            }
        });

        // 頂部全區間總覽：總預約 XX (實際預約XX+取消預約X) 實際到店XX
        const totalRangeAll = totalRangeValid + totalRangeCancel;
        document.getElementById('rangeSummaryBadge').innerHTML = `
            總預約 ${totalRangeAll} 
            (<span class="highlight-actual">實際預約 ${totalRangeValid}</span> + <span class="highlight-cancel">取消預約 ${totalRangeCancel}</span>) 
            <span class="highlight-arrived">實際到店 ${totalRangeArrived}</span>
        `;

        // 2. 人員區間表現統計
        const statsByConsultant = {};
        filteredRows.forEach(r => {
            if (!statsByConsultant[r.consultant]) {
                statsByConsultant[r.consultant] = {
                    name: r.consultant,
                    totalValid: 0,
                    totalCancel: 0,
                    totalArrived: 0,
                    championCount: 0,
                    goodCount: 0,
                    targetCount: 0,
                    lowCount: 0
                };
            }
            if (r.isCanceled) {
                statsByConsultant[r.consultant].totalCancel++;
            } else {
                statsByConsultant[r.consultant].totalValid++;
                if (r.isCompleted) {
                    statsByConsultant[r.consultant].totalArrived++;
                }
            }
        });

        // 逐日評定冠軍與達標 (依實際預約計算)
        Object.keys(dailyMap).forEach(d => {
            const dayObj = dailyMap[d];
            let maxCount = -1;
            const conList = Object.values(dayObj.consultants);

            conList.forEach(c => {
                if (c.validCount > maxCount) maxCount = c.validCount;
            });

            conList.forEach(c => {
                const stat = statsByConsultant[c.name];
                if (!stat) return;

                if (maxCount > 0 && c.validCount === maxCount) {
                    stat.championCount++;
                }

                if (c.validCount >= 6) {
                    stat.goodCount++;
                } else if (c.validCount >= 4) {
                    stat.targetCount++;
                } else {
                    stat.lowCount++;
                }
            });
        });

        // 渲染總覽卡片
        renderOverviewGrid(Object.values(statsByConsultant).sort((a, b) => (b.totalValid + b.totalCancel) - (a.totalValid + a.totalCancel)));

        // 渲染每日明細清單
        const sortedDates = Object.keys(dailyMap).sort();
        renderDailySection(sortedDates.map(d => dailyMap[d]));
    }

    // 渲染總覽卡片
    function renderOverviewGrid(list) {
        const grid = document.getElementById('consultantOverviewGrid');
        grid.innerHTML = '';

        if (list.length === 0) {
            grid.innerHTML = '<div style="color:var(--text-muted); padding:20px; grid-column:1/-1;">選取區間內無預約資料</div>';
            return;
        }

        list.forEach(c => {
            const totalAppointments = c.totalValid + c.totalCancel;
            const card = document.createElement('div');
            card.className = 'consultant-card';
            card.innerHTML = `
                <div class="card-person-name">
                    <span>👤</span> ${c.name}
                </div>
                <div class="card-booking-badge">
                    <div>總預約數 ${totalAppointments}</div>
                    <span class="card-booking-sub">
                        (<span class="highlight-actual">實際預約 ${c.totalValid}</span>+<span class="highlight-cancel">取消預約 ${c.totalCancel}</span>) 
                        <span class="highlight-arrived">實際到店 ${c.totalArrived}</span>
                    </span>
                </div>
                <div class="card-stats-list">
                    <div class="stat-item">
                        <span class="stat-label"><span style="color:var(--badge-champion)">👑</span> 冠軍</span>
                        <span class="stat-val">${c.championCount} 次</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label"><span style="color:var(--badge-good)">🔥</span> 優良 <span style="font-size:0.75rem;color:#999;">(≥6)</span></span>
                        <span class="stat-val">${c.goodCount} 次</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label"><span style="color:var(--badge-target)">🟢</span> 達標 <span style="font-size:0.75rem;color:#999;">(4-5)</span></span>
                        <span class="stat-val">${c.targetCount} 次</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label"><span style="color:var(--badge-low)">⚠️</span> 不足 <span style="font-size:0.75rem;color:#999;">(&lt;4)</span></span>
                        <span class="stat-val">${c.lowCount} 次</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 渲染每日細項
    function renderDailySection(dayList) {
        const container = document.getElementById('dailyListContainer');
        container.innerHTML = '';

        if (dayList.length === 0) {
            container.innerHTML = '<div style="background:white; padding:30px; text-align:center; border-radius:12px; color:#999;">此區間無每日預約細項</div>';
            return;
        }

        dayList.forEach(day => {
            const isToday = (day.date === todayStr);
            const totalDayAppointments = day.validCount + day.cancelCount;
            const card = document.createElement('div');
            card.className = `daily-card ${isToday ? 'today-card' : ''}`;
            card.id = 'date-' + day.date;

            const sortedCons = Object.values(day.consultants).sort((a, b) => (b.validCount + b.cancelCount) - (a.validCount + a.cancelCount));
            let conRowsHtml = '';

            sortedCons.forEach(con => {
                const conTotal = con.validCount + con.cancelCount;
                let tagsHtml = '';

                // 全數取消時的文字提醒
                if (con.validCount === 0 && con.cancelCount > 0) {
                    tagsHtml += `<span class="all-canceled-note">（當日預約均已取消）</span>`;
                }

                // 正常預約顧客 (列在前方)
                con.validCustomers.forEach(cust => {
                    const jsonStr = JSON.stringify(cust).replace(/"/g, '&quot;');
                    const checkIcon = cust.isCompleted ? '<span class="icon-completed" title="服務狀態：已完成">✓</span> ' : '';
                    tagsHtml += `<button class="customer-btn" onclick="showCustomerModal(${jsonStr})">${checkIcon}${cust.C || '顧客'}</button>`;
                });

                // 取消預約顧客 (固定排在最後方，帶有刪除線)
                con.canceledCustomers.forEach(cust => {
                    const jsonStr = JSON.stringify(cust).replace(/"/g, '&quot;');
                    tagsHtml += `<button class="customer-btn is-canceled" onclick="showCustomerModal(${jsonStr})" title="預約狀況：取消">${cust.C || '顧客'}</button>`;
                });

                conRowsHtml += `
                    <div class="daily-con-row">
                        <div class="con-name-badge">
                            <span>✦</span> ${con.name}：${conTotal} 
                            (<span class="highlight-actual">實際預約 ${con.validCount}</span>+<span class="highlight-cancel">取消預約 ${con.cancelCount}</span>) 
                            <span class="highlight-arrived">實際到店 ${con.arrivedCount}</span>
                        </div>
                        <div class="customer-tags-flow">
                            ${tagsHtml}
                        </div>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="daily-header">
                    <div class="daily-date">
                        ${day.date}
                        ${isToday ? '<span class="today-pill">今日</span>' : ''}
                    </div>
                    <div class="daily-total-badge">
                        總預約 ${totalDayAppointments} 
                        (<span class="highlight-actual">實際預約 ${day.validCount}</span> + <span class="highlight-cancel">取消預約 ${day.cancelCount}</span>) 
                        <span class="highlight-arrived">實際到店 ${day.arrivedCount}</span>
                    </div>
                </div>
                <div class="daily-consultants-list">
                    ${conRowsHtml}
                </div>
            `;
            container.appendChild(card);
        });

        setTimeout(() => {
            const target = document.getElementById('date-' + todayStr);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 400);
    }

    // 彈出視窗顯示 A, B, C, G, H, J, M, N, O, P 欄位
    function showCustomerModal(cust) {
        document.getElementById('modalCustomerName').innerText = `${cust.C || '顧客'} - 預約明細`;
        const body = document.getElementById('modalCustomerDetails');
        const isCanceled = cust.isCanceled;
        
        body.innerHTML = `
            <div class="detail-row"><div class="detail-col-label">客戶姓名 (C)</div><div class="detail-col-val">${cust.C || '-'}</div></div>
            <div class="detail-row"><div class="detail-col-label">客戶編號 (A)</div><div class="detail-col-val">${cust.A || '-'}</div></div>
            <div class="detail-row"><div class="detail-col-label">客戶電話 (B)</div><div class="detail-col-val">${cust.B || '-'}</div></div>
            <div class="detail-row"><div class="detail-col-label">預約狀況 (G)</div><div class="detail-col-val"><span style="color:${isCanceled ? '#C62828' : '#2E7D32'}; font-weight:700;">${cust.G || '-'}</span></div></div>
            <div class="detail-row"><div class="detail-col-label">服務狀態 (H)</div><div class="detail-col-val"><span style="color:${cust.isCompleted ? '#2E7D32' : '#634343'}; font-weight:600;">${cust.isCompleted ? '✓ ' : ''}${cust.H || '-'}</span></div></div>
            <div class="detail-row"><div class="detail-col-label">預約時間 (J)</div><div class="detail-col-val">${cust.J || '-'}</div></div>
            <div class="detail-row"><div class="detail-col-label">協助人員 (M)</div><div class="detail-col-val">${cust.M || '無'}</div></div>
            <div class="detail-row"><div class="detail-col-label">預約醫師 (N)</div><div class="detail-col-val">${cust.N || '無'}</div></div>
            <div class="detail-row"><div class="detail-col-label">預約療程 (O)</div><div class="detail-col-val">${cust.O || '無'}</div></div>
            <div class="detail-row"><div class="detail-col-label">備  註 (P)</div><div class="detail-col-val">${cust.P || '無'}</div></div>
        `;
        document.getElementById('customerModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customerModal').style.display = 'none';
    }

    window.onclick = function(e) {
        if (e.target === document.getElementById('customerModal')) closeModal();
    };

    function applyDateFilter() {
        const start = document.getElementById('filterStartDate').value;
        const end = document.getElementById('filterEndDate').value;
        updateDashboard(start, end);
    }

    function resetDateFilter() {
        document.getElementById('filterStartDate').value = '';
        document.getElementById('filterEndDate').value = '';
        updateDashboard(null, null);
    }

    // 監聽 Excel 檔案上傳
    document.getElementById('excelFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('fileStatusText').innerText = `已載入檔案：${file.name}`;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
            allAppointments = parseRows(jsonRows);

            const dates = allAppointments.map(r => r.date).filter(Boolean).sort();
            if (dates.length > 0) {
                document.getElementById('filterStartDate').value = dates[0];
                document.getElementById('filterEndDate').value = dates[dates.length - 1];
            }
            updateDashboard(dates[0], dates[dates.length - 1]);
        };
        reader.readAsArrayBuffer(file);
    });

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('fileStatusText').innerText = '請點選左側按鈕匯入預約明細 Excel 檔案';
        document.getElementById('dailyListContainer').innerHTML = `
            <div style="background:white; border-radius:12px; padding:45px 20px; text-align:center; color:#8C7B7B; border:1px solid #EADCDC;">
                <p style="font-size:1.1rem; margin-bottom:10px;">尚未匯入 Excel 檔案</p>
                <p style="font-size:0.88rem;">請點選上方「上傳 / 切換 Excel 檔案」載入報表即可呈現完整總覽分析！</p>
            </div>
        `;
    });
</script>
</body>
</html>
